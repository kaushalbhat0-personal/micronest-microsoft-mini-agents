<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      font-size: 13px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 2px 0;
    }
    .subtitle {
      font-size: 12px;
      color: #666;
      margin: 0 0 12px 0;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 13px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
    }
    .dot.connected { background: #22c55e; }
    .dot.disconnected { background: #ef4444; }
    .dot.sending { background: #3b82f6; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .session-card {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fafafa;
    }
    .session-card h3 {
      font-size: 13px;
      margin: 0 0 8px 0;
    }
    .progress-bar {
      height: 4px;
      background: #e5e7eb;
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      border-radius: 2px;
      transition: width 0.3s;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      margin-bottom: 8px;
    }
    .stat {
      text-align: center;
      font-size: 11px;
    }
    .stat-value {
      font-size: 16px;
      font-weight: 600;
    }
    .stat-label {
      color: #666;
    }
    .stat-value.sent { color: #22c55e; }
    .stat-value.skipped { color: #f59e0b; }
    .stat-value.failed { color: #ef4444; }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    button {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #f3f4f6; }
    button.primary { background: #3b82f6; color: white; border-color: #3b82f6; }
    button.primary:hover { background: #2563eb; }
    button.danger { color: #ef4444; border-color: #ef4444; }
    button.danger:hover { background: #fef2f2; }
    .no-session {
      margin-top: 12px;
      padding: 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
    }
    .loading {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>MicroNest</h1>
  <p class="subtitle">Assisted WhatsApp Sending</p>

  <div class="status-row">
    <span class="dot disconnected" id="statusDot"></span>
    <span id="statusText">Checking...</span>
  </div>

  <div id="sessionArea" class="no-session">No active session</div>

  <script src="popup.js"></script>
</body>
</html>
